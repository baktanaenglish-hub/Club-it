# Local PostgreSQL for development: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: clubit
      POSTGRES_USER: clubit
      POSTGRES_PASSWORD: clubit
    ports:
      - "5432:5432"
    volumes:
      - clubit-db:/var/lib/postgresql/data

volumes:
  clubit-db:
